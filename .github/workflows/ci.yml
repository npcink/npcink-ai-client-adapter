name: Adapter CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: adapter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-contracts:
    name: PHP contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run static contracts
        run: composer test:all

      - name: Check adapter CLI syntax
        run: npm --prefix packages/adapter-cli run check

      - name: Run adapter CLI contract tests
        run: npm --prefix packages/adapter-cli test

      - name: Run WordPress.org review guard
        run: composer check:wporg

  static-analysis:
    name: Static analysis (advisory)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Advisory gates: PHPStan findings render as GitHub annotations;
      # PHPCS findings appear in this job's log. They never block a PR.
      # Promote to enforced by removing continue-on-error once the findings
      # budget reaches zero on master.
      - name: Run PHPStan (level 5)
        run: composer analyse:php -- --error-format=github
        continue-on-error: true

      - name: Run PHPCS (WordPress-Core)
        run: composer lint:standards
        continue-on-error: true

      # Newer-PHP execution leg: the floor stays 8.0, this catches forward
      # compatibility drift on the current development runtime.
      - name: Run static contracts on PHP 8.4
        run: composer test
